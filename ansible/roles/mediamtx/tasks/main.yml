---
# MediaMTX: RTMP in from phones (port 1935, direct to the VPS — Cloudflare
# does not proxy RTMP), HLS out through Pomerium on stream.practice.exchange.
# Joins the supabase compose project's frontend network so Pomerium can
# reach it by container name.

- name: Create MediaMTX directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ mediamtx_dir }}"
    - "{{ mediamtx_dir }}/recordings"

- name: Template MediaMTX config
  template:
    src: mediamtx.yml.j2
    dest: "{{ mediamtx_dir }}/mediamtx.yml"
    mode: "0640"
  register: mediamtx_config
  no_log: true

- name: Copy the stream sampler from the sideline repo
  copy:
    src: "{{ playbook_dir }}/../../sideline/scripts/stream-stats.sh"
    dest: "{{ mediamtx_dir }}/stream-stats.sh"
    mode: "0755"

- name: Template docker-compose for MediaMTX
  template:
    src: docker-compose.yml.j2
    dest: "{{ mediamtx_dir }}/docker-compose.yml"
    mode: "0644"
  register: mediamtx_compose

- name: Start MediaMTX
  community.docker.docker_compose_v2:
    project_src: "{{ mediamtx_dir }}"
    state: present
    pull: missing

- name: Restart MediaMTX if config changed
  community.docker.docker_compose_v2:
    project_src: "{{ mediamtx_dir }}"
    state: restarted
  when: mediamtx_compose is changed or mediamtx_config is changed

# The mediamtx image is scratch-based (no shell, no wget); probe it from the
# nginx sidecar that shares the frontend network.
- name: Verify MediaMTX API answers (post-deploy gate)
  shell: docker exec supabase-static-jimr-1 wget -qO- http://mediamtx:9997/v3/paths/list
  register: mediamtx_paths
  changed_when: false
  retries: 5
  delay: 3
  until: mediamtx_paths.rc == 0

# Archive: recordings older than 48 h go to Cloudflare R2, then leave the disk.
# The sweep and restore scripts are proven in the sideline repo's harness.
- name: Install rclone from Ubuntu's repo
  apt:
    name: rclone
    state: present
    update_cache: true
  when: vault_r2_access_key_id is defined

- name: Template rclone.conf for R2
  template:
    src: rclone.conf.j2
    dest: "{{ mediamtx_dir }}/rclone.conf"
    mode: "0600"
    owner: deploy
    group: deploy
  no_log: true
  when: vault_r2_access_key_id is defined

- name: Copy the archive scripts from the sideline repo
  copy:
    src: "{{ playbook_dir }}/../../sideline/scripts/archive/{{ item }}"
    dest: "{{ mediamtx_dir }}/{{ item }}"
    mode: "0755"
  loop: [sweep.sh, restore.sh]

- name: Recordings dir is writable by the sweep user
  file:
    path: "{{ mediamtx_dir }}/recordings"
    state: directory
    owner: deploy
    group: deploy
    mode: "0775"

- name: Install the archive service and timer
  template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [sideline-archive.service, sideline-archive.timer]
  register: archive_units
  when: vault_r2_access_key_id is defined

- name: Enable the hourly archive timer
  systemd:
    name: sideline-archive.timer
    enabled: true
    state: started
    daemon_reload: "{{ archive_units is changed }}"
  when: vault_r2_access_key_id is defined

- name: Verify the sweep user can list the R2 bucket (post-deploy gate)
  become: true
  become_user: deploy
  command: rclone --config {{ mediamtx_dir }}/rclone.conf lsd r2:sideline-recordings
  changed_when: false
  when: vault_r2_access_key_id is defined
